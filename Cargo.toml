[package]
name = "mod-events"
# 1.0.0 (2026-05-18) — stable API. Public surface frozen under
# SemVer for the entire 1.x line. Includes a perf tune over 0.9.x:
# internal TypeIdHasher skips SipHash on the hot path, outer
# `Arc<RwLock<...>>` wrappers stripped, hot-path functions
# carry #[inline]. Criterion: ~90 ns single-listener emit (was
# ~133 ns in 0.9.x). MiddlewareManager/MiddlewareFunction moved to
# `pub(crate)`. Priority and EventMetadata gained
# `#[non_exhaustive]` for forward-compat. See docs/STABILITY.md and
# CHANGELOG.md `[1.0.0]`.
version = "1.0.0"
edition = "2021"
# MSRV. Bumped from 1.75 → 1.81 because Cargo lockfile format v4
# (default since Rust 1.78) cannot be parsed by older toolchains. CI's
# MSRV job tried 1.75 and failed at lockfile parse before any code
# compiled. 1.81 is conservative — stable since 2024-09-05, well over a
# year of release window by mid-2026.
rust-version = "1.81"
readme = "README.md"
license = "Apache-2.0"

homepage = "https://github.com/jamesgober/mod-events"
repository = "https://github.com/jamesgober/mod-events"
documentation = "https://docs.rs/mod-events"
description = "A high-performance, zero-overhead event dispatcher library for Rust"
keywords = ["events", "dispatcher", "async", "performance", "observer"]
categories = ["concurrency", "asynchronous", "data-structures"]

authors = ["James Gober <me@jamesgober.com>"]

# Strip only the truly-internal files from the published tarball.
# Examples, benches, and docs ship — vendoring users get them, and
# crates.io / docs.rs render them. Excluding `examples/` and
# `benches/` while declaring `[[bench]]` triggered `cargo publish`
# warnings ("ignoring example/benchmark, not in published package");
# shipping them removes the warning at zero real cost (a few KB on
# the tarball).
exclude = [
    ".dev/",
    ".github/",
    ".editorconfig",
    ".gitattributes",
    ".gitignore",
    "rust-toolchain.toml",
    "deny.toml",
    "REPS.md",
]


#####################################################
# FEATURES
#####################################################
[features]
default = ["async"]
# The `async` feature gates the async dispatch APIs. It pulls in
# `futures-util` for its `FutureExt::catch_unwind` (the panic-safety
# wrapper around async listeners). It does NOT pull in tokio or any
# other runtime — `mod-events` is runtime-agnostic and works with any
# executor that polls `std::future::Future` (tokio, async-std, smol,
# embassy, etc.). Examples and tests use tokio for convenience, but
# that lives under `[dev-dependencies]` and is not propagated.
async = ["dep:futures-util"]


#####################################################
# LINTS
#####################################################
[lints.rust]
# `--cfg loom` activates `tests/loom_concurrent.rs`. Declared here so
# `cargo clippy --all-targets` does not flag the cfg gate as unknown.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }


#####################################################
# BENCHMARKS
#####################################################
[[bench]]
name = "dispatch_benchmark"
harness = false

#####################################################
# DEPENDENCIES
#####################################################
[dependencies]
# why: provides RwLock and Mutex without lock poisoning. Used for the
# dispatcher's listener registry, middleware chain, and per-event-type
# `Mutex<Instant>` last-dispatch timestamp. Critical hot-path dependency
# — REPS §Dependency Management requires exact pins for critical crates,
# so this is `=0.12.4` rather than a caret range.
parking_lot = "=0.12.5"

# why: provides `FutureExt::catch_unwind` for panic-safety on the async
# dispatch path (mirrors the `std::panic::catch_unwind` wrapping the
# sync path). Implementing this ourselves would require a `// SAFETY`
# block for pin projection; pulling in the well-audited futures-util
# implementation is preferable to growing the unsafe surface. Optional,
# only compiled when the `async` cargo feature is enabled. Minimal
# `std` feature set — does NOT bring in futures-executor / futures-io.
futures-util = { version = "0.3", default-features = false, features = ["std"], optional = true }


#####################################################
# DEV DEPENDENCIES
#####################################################
[dev-dependencies]
# why: examples and integration tests that exercise the async path need
# the macros (`#[tokio::main]`, `#[tokio::test]`), the multi-threaded
# runtime, and `tokio::time::sleep`. `full` is acceptable in the dev
# profile because dev-dependencies are not propagated to consumers. Wide
# caret range (`1`) is fine here for the same reason.
tokio = { version = "1", features = ["full"] }

# why: criterion drives `benches/dispatch_benchmark.rs`. Required by REPS
# §Testing for performance-sensitive code paths. Dev-only, so a caret on
# the minor version is acceptable. `async_tokio` feature gates the
# `Bencher::to_async` adapter used by `bench_dispatch_async_*` targets.
criterion = { version = "0.5", features = ["async_tokio"] }

# why: model-checks the dispatcher's double-checked-locking pattern in
# `tests/loom_concurrent.rs`. The actual dispatcher uses
# `parking_lot::RwLock`, which loom does not natively model; the loom
# test reproduces the *algorithm* on `loom::sync::RwLock` so that
# exhaustive interleaving exploration covers it. Loom test only compiles
# under `RUSTFLAGS="--cfg loom"`, so the dep does not impact ordinary
# builds.
loom = "0.7"

# why: drives the property tests in `tests/property_tests.rs`, which
# generate randomised sequences of subscribe / unsubscribe / dispatch
# operations and assert dispatcher invariants across thousands of cases.
# REPS §Testing requires property-based tests for "algorithms that
# SHOULD hold for all inputs."
proptest = "1"
