name: CI

on:
  push:
    branches: [main]
  pull_request:

# Every job only reads the repository. The supply-chain jobs print their
# findings to the log and fail the job instead of posting Check Runs, so
# no write scope is needed.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------
  # Cross-platform check matrix. Covers every supported tier-1 host and
  # both glibc + musl libc on Linux, plus ARM64 on Linux. Every job in
  # this matrix runs the same gates (fmt + clippy + build + test + doc)
  # so platform divergence cannot land without being caught.
  # ---------------------------------------------------------------------
  check:
    name: check / ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: ubuntu-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - label: ubuntu-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - label: ubuntu-x86_64-musl
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - label: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
          - label: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7

      # `dtolnay/rust-toolchain@stable` installs the stable channel,
      # but `rust-toolchain.toml` in the workspace overrides cargo to
      # use the pinned channel (1.95.0). Targets installed via the
      # action's `targets:` parameter would be attached to the wrong
      # toolchain (stable, not 1.95.0), causing `error[E0463]: can't
      # find crate for 'core'` on cross-targets like musl. Install the
      # target separately via `rustup target add` from inside the
      # workspace, where rustup honours rust-toolchain.toml and adds
      # the target to the actually-active toolchain.
      - uses: dtolnay/rust-toolchain@stable
        id: toolchain

      - name: install matrix target on workspace toolchain
        run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          # Cache key includes the target so musl + glibc + arm64 don't
          # thrash each other's caches.
          key: ${{ matrix.target }}

      - name: install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: format
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --all-targets --all-features --target ${{ matrix.target }} -- -D warnings

      - name: clippy (no default features)
        run: cargo clippy --all-targets --no-default-features --target ${{ matrix.target }} -- -D warnings

      - name: build
        run: cargo build --all-features --target ${{ matrix.target }} --verbose

      - name: test
        # The musl target has no host binaries by default and ARM
        # cross-compile from x86 would need QEMU. Both targets run on
        # native hardware here (musl on Linux x86, ARM on a real ARM
        # runner), so the tests just run.
        run: cargo test --all-features --target ${{ matrix.target }} --verbose

      - name: test (no default features)
        # The sync-only build (`async` disabled) is a supported
        # configuration with its own cfg-gated code paths.
        run: cargo test --no-default-features --target ${{ matrix.target }}

      - name: doc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --all-features --target ${{ matrix.target }}

  # ---------------------------------------------------------------------
  # MSRV verification. Builds the crate against the declared minimum
  # supported Rust version. Tests are NOT run here — older toolchains
  # may not understand newer test-only features. The contract is "the
  # public crate compiles on MSRV", not "the dev experience is the same".
  # ---------------------------------------------------------------------
  msrv:
    name: msrv (1.81)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.81.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv-1.81
      - name: build
        # Override rust-toolchain.toml so the MSRV toolchain is used.
        run: RUSTUP_TOOLCHAIN=1.81.0 cargo build --all-features --verbose
      - name: build (no default features)
        run: RUSTUP_TOOLCHAIN=1.81.0 cargo build --no-default-features --verbose

  # ---------------------------------------------------------------------
  # Latest stable lints. Every other job runs on the toolchain pinned in
  # rust-toolchain.toml, so new stable lints and deprecations (and new
  # rustdoc lints) would otherwise surface only when the pin is bumped.
  # This job runs clippy and rustdoc with warnings denied on whatever
  # stable is current, so they show up as soon as a release ships.
  # ---------------------------------------------------------------------
  stable-lints:
    name: lints (latest stable)
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: stable-lints
      - name: clippy
        env:
          RUSTFLAGS: -D warnings
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: doc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --all-features

  # ---------------------------------------------------------------------
  # Supply-chain: known CVEs and dependency policy.
  #
  # Both tools are installed as pinned, prebuilt release binaries through
  # `taiki-e/install-action`. Compiling them with `cargo install` is not
  # an option: the workspace `rust-toolchain.toml` forces the pinned
  # toolchain onto every cargo invocation, and the tools' own dependency
  # trees move their MSRV past it (cargo-audit 0.22.2 failed to build on
  # 1.95.0 because `kstring` 2.0.4 needs rustc 1.96). The previous
  # `rustsec/audit-check@v2` action did exactly that and also targeted
  # the deprecated Node.js 20 runtime. `RUSTUP_TOOLCHAIN=stable` keeps
  # these jobs off the pinned toolchain, since they only read metadata.
  # Bump the pinned tool versions deliberately.
  # ---------------------------------------------------------------------
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit@0.22.2
      - name: cargo audit
        run: cargo audit --deny warnings

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - name: cargo deny
        run: cargo deny check

  # ---------------------------------------------------------------------
  # Concurrency model checking. Reproduces the dispatcher's
  # double-checked-locking pattern on `loom::sync` primitives and
  # explores every legal interleaving.
  # ---------------------------------------------------------------------
  loom:
    name: loom (concurrency model check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: loom
      - name: loom model check
        env:
          # `--cfg loom` activates `tests/loom_concurrent.rs`; release
          # mode keeps loom's exhaustive interleaving exploration
          # tractable.
          RUSTFLAGS: --cfg loom
        run: cargo test --release --test loom_concurrent

  # ---------------------------------------------------------------------
  # AddressSanitizer. Per REPS §Memory Debugging, ASAN MUST be enabled
  # in CI for all tests on Linux and macOS. ASAN is nightly-only;
  # `cargo +nightly` with `-Zsanitizer=address`. Catches use-after-free,
  # double-free, heap-buffer-overflow, and stack-buffer-overflow that
  # the regular tests miss. The crate has no `unsafe` of its own
  # (parking_lot and futures-util do, indirectly) — ASAN exercises
  # those code paths through our integration + property tests.
  # ---------------------------------------------------------------------
  asan:
    name: address sanitizer (linux nightly)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -Z sanitizer=address
      ASAN_OPTIONS: detect_stack_use_after_return=1:detect_leaks=1
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          key: asan
      - name: test under ASAN
        # `-Z build-std` rebuilds std with the sanitizer instrumented;
        # required because precompiled std on the runner is not built
        # with `-Z sanitizer=address`.
        run: |
          cargo +nightly test --all-features \
            --target x86_64-unknown-linux-gnu \
            -Z build-std \
            --tests

  # ---------------------------------------------------------------------
  # Criterion benchmarks. Runs the dispatch_benchmark suite and uploads
  # the report as a build artifact. Persistent baseline tracking and
  # regression-gate-on-PR is roadmap item #31; this job lays the
  # groundwork by ensuring the benches always compile and run on the
  # canonical CI host.
  # ---------------------------------------------------------------------
  bench:
    name: criterion benches
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: bench
      - name: run benchmarks
        run: cargo bench --features async --bench dispatch_benchmark
      - name: upload report
        uses: actions/upload-artifact@v7
        with:
          name: criterion-report
          path: target/criterion
          retention-days: 30
